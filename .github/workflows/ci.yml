name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r validation/core-1.1.0.txt
          python -m pip install '.[test]'
      - name: Verify release candidate
        run: python scripts/verify.py
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-3.12
          path: |
            build/evidence/
            build/release/
          if-no-files-found: error

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        profile: ["core-1.0.1", "core-1.1.0"]
        exclude:
          - python-version: "3.12"
            profile: "core-1.1.0"
    env:
      MERIDIAN_VALIDATION_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r validation/${{ matrix.profile }}.txt
          python -m pip install '.[test]'
      - name: Verify selected release closure
        run: python scripts/verify.py
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python-version }}-${{ matrix.profile }}
          path: |
            build/evidence/
            build/release/
          if-no-files-found: error
