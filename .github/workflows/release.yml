name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install '.[test]'
      - name: Verify tag and release candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("release tag does not match the project version")
          PY
          python scripts/verify.py
      - name: Attest distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/release/*
          build/evidence/verification.json
          --verify-tag
          --generate-notes
          --title "meridian-storage-projection ${GITHUB_REF_NAME#v}"
      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: build/release/*
          if-no-files-found: error

  publish-pypi:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/meridian-storage-projection/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
