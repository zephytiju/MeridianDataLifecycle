name: Released provider conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  durable-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgis/postgis:16-3.4-alpine
            engine: 16-postgis-3.4
          - image: postgis/postgis:17-3.5-alpine
            engine: 17-postgis-3.5
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: meridian_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the exact released composition
        run: |
          python -m pip install -r conformance/requirements.txt
          python -m pip check
      - name: Exercise versioned replay and both shutdown outcomes
        env:
          MERIDIAN_POSTGRESQL_TEST_DSN: host=127.0.0.1 port=5432 dbname=meridian_test user=postgres
          MERIDIAN_POSTGRESQL_ENGINE_VERSION: ${{ matrix.engine }}
        run: |
          mkdir -p build/evidence
          python -I -m pytest conformance/postgresql -q -s \
            --junitxml=build/evidence/released-provider.xml
      - name: Record installed package and example provenance
        run: python -I conformance/record_artifacts.py
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: released-provider-${{ matrix.engine }}
          path: build/evidence/
          if-no-files-found: error
